name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/tu-recommend/"
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/tu-recommend
            
            # Login to GitHub Container Registry using PAT
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest image
            docker pull ghcr.io/minkhantthwin/tu-recommend:latest
            
            # Stop and remove old API container
            docker compose -f docker-compose.prod.yml stop api || true
            docker compose -f docker-compose.prod.yml rm -f api || true
            
            # Start all services with --no-build flag to prevent building
            docker compose -f docker-compose.prod.yml up -d --no-build --pull never
            
            # Wait for API to be ready
            sleep 15
            
            # Check if API container is running
            docker compose -f docker-compose.prod.yml ps
            
            # Show API logs
            echo "📋 API Container Logs:"
            docker compose -f docker-compose.prod.yml logs --tail=50 api
            
            # Run migrations
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy || echo "⚠️ Migration failed or already up to date"
            
            # Clean up old images
            docker image prune -f
            
            echo "✅ Deployment completed!"